# Optional dashboard-only mode (bridge network). Inventory sees only the
# container namespace and Apply cannot change the host firewall.
# Prefer the default docker-compose.yml for a real host firewall desk.

name: port-warden-dashboard

services:
  port-warden:
    build: .
    image: port-warden:local
    env_file:
      - .env
    environment:
      PORT_WARDEN_BIND_HOST: 0.0.0.0
      PORT_WARDEN_BIND_PORT: "9090"
      PORT_WARDEN_EXPOSE_PUBLIC: "1"
      PORT_WARDEN_HOST_NETWORK: "0"
      PORT_WARDEN_NFT_BACKEND: disabled
      PORT_WARDEN_DATA_DIR: /var/lib/port-warden
      PORT_WARDEN_DATABASE_URL: sqlite:////var/lib/port-warden/port-warden.sqlite
      PORT_WARDEN_COOKIE_SECURE: "1"
      PORT_WARDEN_SSL_CERTFILE: /etc/port-warden/tls/cert.pem
      PORT_WARDEN_SSL_KEYFILE: /etc/port-warden/tls/key.pem
      PORT_WARDEN_SECRET_KEY: ${PORT_WARDEN_SECRET_KEY:-compose-dev-secret-change-me-please}
      PORT_WARDEN_ADMIN_USERNAME: ${PORT_WARDEN_ADMIN_USERNAME:-admin}
      PORT_WARDEN_ADMIN_PASSWORD: ${PORT_WARDEN_ADMIN_PASSWORD:-portwarden-change-me}
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - ./data:/var/lib/port-warden
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
