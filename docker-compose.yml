# Host firewall desk:
#   docker compose up --build
# UI: https://<host>:9090/ (self-signed cert from image build)
#
# This service uses the host network namespace and CAP_NET_ADMIN so inventory
# sees host listeners (for example SSH on 2222) and Apply installs
# table inet port_warden in front of the host input path.
# It is not --privileged. Preview/confirm is still required before Apply.
#
# Before the first enforce Apply, set PORT_WARDEN_SSH_PORT to your real SSH
# port and put your admin CIDR in PORT_WARDEN_MANAGEMENT_CIDRS.

name: port-warden

services:
  port-warden:
    build: .
    image: port-warden:local
    # String path only — older Compose rejects the {path, required} object form.
    env_file:
      - .env
    network_mode: host
    environment:
      PORT_WARDEN_BIND_HOST: 0.0.0.0
      PORT_WARDEN_BIND_PORT: "9090"
      PORT_WARDEN_EXPOSE_PUBLIC: "1"
      PORT_WARDEN_HOST_NETWORK: "1"
      PORT_WARDEN_NFT_BACKEND: local
      PORT_WARDEN_MANAGEMENT_CIDRS: ${PORT_WARDEN_MANAGEMENT_CIDRS:-127.0.0.1/32,::1/128}
      PORT_WARDEN_DATA_DIR: /var/lib/port-warden
      PORT_WARDEN_DATABASE_URL: sqlite:////var/lib/port-warden/port-warden.sqlite
      PORT_WARDEN_COOKIE_SECURE: "1"
      PORT_WARDEN_SSL_CERTFILE: /etc/port-warden/tls/cert.pem
      PORT_WARDEN_SSL_KEYFILE: /etc/port-warden/tls/key.pem
      PORT_WARDEN_SECRET_KEY: ${PORT_WARDEN_SECRET_KEY:-compose-dev-secret-change-me-please}
      PORT_WARDEN_ADMIN_USERNAME: ${PORT_WARDEN_ADMIN_USERNAME:-admin}
      PORT_WARDEN_ADMIN_PASSWORD: ${PORT_WARDEN_ADMIN_PASSWORD:-portwarden-change-me}
    volumes:
      - ./data:/var/lib/port-warden
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - NET_ADMIN
    # no-new-privileges is omitted here so setpriv can keep ambient NET_ADMIN
    # after the uid drop for local nft apply.
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:9090/health', context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  honeypot-ssh:
    profiles: ["honeypots"]
    build:
      context: .
      dockerfile: Dockerfile.honeypot
    environment:
      DECOY_MODE: ssh
      DECOY_PORT: "2222"
      HONEYPOT_LOG: /var/log/honeypot/ssh.jsonl
    ports:
      - "2222:2222"
    volumes:
      - ./data/honeypot:/var/log/honeypot
    networks: [decoy]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped

  honeypot-http:
    profiles: ["honeypots"]
    build:
      context: .
      dockerfile: Dockerfile.honeypot
    environment:
      DECOY_MODE: http
      DECOY_PORT: "8088"
      HONEYPOT_LOG: /var/log/honeypot/http.jsonl
    ports:
      - "8088:8088"
    volumes:
      - ./data/honeypot:/var/log/honeypot
    networks: [decoy]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped

networks:
  decoy:
    internal: true
